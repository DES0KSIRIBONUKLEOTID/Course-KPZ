# Blueprint для Render: серверна частина (Laravel у Docker) на безкоштовному плані.
# База даних MySQL-сумісна, розміщується окремо (TiDB Cloud), її параметри задаються в панелі Render.
services:
  - type: web
    name: service-center-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /up
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: LOG_CHANNEL
        value: stderr
      - key: APP_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "4000"
      - key: DB_DATABASE
        value: service_center
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: MYSQL_ATTR_SSL_CA
        value: /etc/ssl/certs/ca-certificates.crt
      - key: SEED_DEMO
        value: "true"
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: SEED_MASTER_PASSWORD
        sync: false
